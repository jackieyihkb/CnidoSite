# ---------------------------------------------------------------------------
# Cnidaria de-novo TE annotation pipeline — central configuration
# Sourced by every script in bin/. Override any value from the environment,
# e.g.  EDTA_THREADS=48 bin/run_species.sh Nematostella_vectensis
# ---------------------------------------------------------------------------

export TE_ROOT="${TE_ROOT:-/mnt/sda/jackie/cnidaria/codex/genome_TE}"
export TE_PIPE="$TE_ROOT/TE_pipeline"
# Per-species scratch / EDTA working dirs.
#
# Deliberately NOT "$TE_ROOT/work": a copy of results from another server is
# still landing in work/ (it was ~20 MB/s and growing when this was set up).
# That copy contains *incomplete* trees from a run that lost its LTR module,
# and EDTA --overwrite 0 resumes from whatever it finds on disk, so it would
# silently adopt truncated results.  Keeping our scratch separate also means
# the incoming copy can finish without us writing into the same directories.
export TE_WORK="$TE_ROOT/te_work"
export TE_RESULTS="$TE_ROOT/results"    # final deliverables

# Conda env holding EDTA + RepeatMasker + genometools + bedtools
export EDTA_ENV="${EDTA_ENV:-/home/$USER/miniconda3/envs/EDTA}"

# ---- EDTA -----------------------------------------------------------------
export EDTA_SPECIES="${EDTA_SPECIES:-others}"
export EDTA_SENSITIVE="${EDTA_SENSITIVE:-1}"   # 1 = also harvest RepeatModeler TEs missed by structure
export EDTA_ANNO="${EDTA_ANNO:-1}"             # 1 = run the whole-genome RepeatMasker annotation
# 0 = skip the consistency self-blast at the end of the ANNO stage.
#
# EDTA.pl:815 guards that whole block with `if ($evaluate == 1)`, and it is
# diagnostic only: every deliverable (TEanno.gff3/.sum/.split.gff3, MAKER.masked,
# the density plots) is written before it, and its own *.TE.fa.stat.*.sum files
# stay in te_work.  Measured cost on Nemopilema_nomurai: 10:58:00 -> 11:15:34 =
# 17 min 34 s of extra wall clock per species, after which upstream DIED with
# "ERROR: TE annotation stats results not found" (it reads a .stat this route
# does not produce).  So 0 saves ~18 min per species on 34_redo_anno.sh runs and
# removes a spurious ERROR from the log.
#
# NOTE: this cannot help the 61 species already in flight -- their EDTA.pl was
# launched with --evaluate 1 in argv and no running process can be re-env'd or
# re-arg'd.  It applies to repairs and to any species dispatched from here on.
export EDTA_EVALUATE="${EDTA_EVALUATE:-0}"
export EDTA_MAXDIV="${EDTA_MAXDIV:-40}"
export EDTA_OVERWRITE="${EDTA_OVERWRITE:-0}"   # 0 = resume a partially finished species
export EDTA_THREADS="${EDTA_THREADS:-32}"      # per-species thread budget (scheduler overrides)

# NOTE: we deliberately do NOT wrap `gt` (genometools).  An earlier revision of
# this pipeline put a bash shim in front of gt to cap its runtime, and that shim
# broke EDTA's own timeout: EDTA runs each harvester as
# `timeout -s KILL 300s gt ...`, and with the shim in the way the SIGKILL landed
# on the shim, orphaning the real gt.  Thousands of orphaned gt processes then
# corrupted the parent's heap.  Symptoms were
#     LTR_HARVEST_parallel: malloc(): corrupted top size  (core dumped)
#     gt ltrharvest: Fatal glibc error: pthread_mutex_lock.c:94
# and, worst of all, a silently EMPTY LTR module:
#     ERROR: 179 intact LTR-RTs have found, but the pre-library file ... is empty
#     Warning: The LTR result file has 0 bp!
# With stock gt the same job completes (verified: 37,922 pieces, RC=0).  EDTA's
# own `-time` handling is the timeout; leave genometools unwrapped.

# ---- table building -------------------------------------------------------
export PROMOTER_UP="${PROMOTER_UP:-2000}"      # bp upstream of TSS called "promoter"
export PROMOTER_DOWN="${PROMOTER_DOWN:-0}"     # bp into the 5'UTR still called promoter

# ---- scheduler ------------------------------------------------------------
# This host has 768 cores / 1.5 TB RAM (shared with other users), so throughput
# comes from running several species at once: RepeatModeler -- the LINE module,
# which EDTA runs for every genome regardless of --sensitive -- is largely
# single-threaded, so a species given 64 threads is barely faster than one given
# 24.
#
# "All 64 at once, not batches" was the original reasoning and it was wrong for
# this box.  Measured 2026-09-27 00:10 with 52 species up: 791 cores of demand
# on 768 cores, load average 3238, ~3000 runnable threads, and no species
# finished for 24 h.  RepeatModeler's per-round batch parallelism means a
# species asks for far more runnable threads than its -threads value, so 52 of
# them do not fit; queueing depth roughly 4x the core count was costing more
# than the extra species bought.
#
# The cap below is the scheduler's own limit and is NOT a global one: species
# already owned by another job (including the ones throttle.py has stopped) are
# counted as held, not as running, so they do not count against it.  The real
# global control is throttle.py, which stops and resumes whole species process
# groups to hold the SUM OF -threads near THROTTLE_THREADS.
#
#   python3 TE_pipeline/bin/throttle.py status
#
# Memory was never the constraint: 588 GB used of 1510 GB at the time of that
# measurement, with 922 GB available.
export TE_MAX_JOBS="${TE_MAX_JOBS:-30}"        # concurrent species
export TE_MEM_BUDGET_GB="${TE_MEM_BUDGET_GB:-900}"   # total RAM the scheduler may hand out
