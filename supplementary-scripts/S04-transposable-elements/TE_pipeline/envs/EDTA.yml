# Minimal environment spec for the cnidaria de-novo TE pipeline.
#
# This is the single environment everything runs in.  The exact, fully pinned
# lockfile of the environment already installed on this machine is
# EDTA.full.yml next to this file; use that one to reproduce byte-for-byte.
#
#   mamba env create -f TE_pipeline/envs/EDTA.full.yml
#   conda  env create -f TE_pipeline/envs/EDTA.yml
#
# Already installed here at: /home/$USER/miniconda3/envs/EDTA
name: EDTA
channels: [conda-forge, bioconda]
dependencies:
  # de-novo TE library + whole-genome annotation
  - edta=2.2.2
  - repeatmasker=4.2.1       # EDTA drives this; also usable standalone
  - repeatmodeler=2.0.7      # EDTA runs this on the whole genome (LINE module)
  - repeatscout=1.0.7
  - recon=1.08
  - rmblast=2.14.1
  - genometools-genometools=1.6.5   # `gt ltrharvest`
  - ltr_finder=1.07
  - ltr_finder_parallel=1.3
  - ltr_harvest_parallel=1.2
  - ltr_retriever=3.0.4
  - tir-learner=3.0.7
  - helitronscanner=1.0
  - annosine2=2.0.9
  - tesorter=1.4.7
  - trf=4.10.0rc2
  - mafft=7.526
  - hmmer=3.4
  - cd-hit=4.8.1
  # table building
  - bedtools=2.31.1
  - python=3.12
